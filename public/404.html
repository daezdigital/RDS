<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página No Encontrada | RDS Agencia Audiovisual</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0D0D0D;
      color: #ECE9F4;
      font-family: 'Inter', sans-serif;
      min-h: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .badge {
      border: 1px solid rgba(242, 27, 66, 0.4);
      background: rgba(242, 27, 66, 0.08);
      color: #f21b42;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      padding: 0.4rem 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 900;
      color: #f21b42;
      line-height: 0.9;
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }
    p {
      color: rgba(236, 233, 244, 0.6);
      font-size: 1.125rem;
      max-width: 480px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 1rem 2rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #f21b42;
      color: #ECE9F4;
    }
    .btn-primary:hover {
      background: #d11235;
    }
    .btn-secondary {
      border: 1px solid rgba(236, 233, 244, 0.3);
      color: #ECE9F4;
    }
    .btn-secondary:hover {
      background: #ECE9F4;
      color: #0D0D0D;
    }
  </style>
</head>
<body>
  <div class="badge">Error 404 // Fuera de Cuadro</div>
  <h1>404</h1>
  <p>La escena que estás buscando no existe o se ha movido durante el montaje final.</p>
  <div class="btn-group">
    <a href="/" class="btn-primary">Volver al Inicio</a>
    <a href="https://app.rdsvzla.com/" class="btn-secondary" target="_blank" rel="noopener noreferrer">Iniciar Sesión</a>
  </div>
</body>
</html>
